{% extends 'base_apple.html' %}

{% block title %}Change Password - Mindful{% endblock %}

{% block extra_css %}
<style>
    .password-container {
        width: 100%;
        margin: 0 auto;
    }
    
    .form-group {
        margin-bottom: 24px;
    }
    
    .form-label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: #1d1d1f;
        margin-bottom: 8px;
    }
    
    .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #d2d2d7;
        border-radius: 12px;
        font-size: 16px;
        font-family: inherit;
        transition: all 0.2s;
    }
    
    .form-input:focus {
        outline: none;
        border-color: #0071e3;
        box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
    }
    
    .button-group {
        display: flex;
        gap: 12px;
        margin-top: 32px;
    }
    
    .help-text {
        font-size: 13px;
        color: #86868b;
        margin-top: 8px;
    }
</style>
{% endblock %}

{% block content %}
<div class="password-container">
    <div class="card">
        <h2>Change Password</h2>
        <p class="subtitle" style="margin-bottom: 32px;">Update your account password</p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="id_old_password">Current Password</label>
                <input type="password" name="old_password" id="id_old_password" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_new_password1">New Password</label>
                <input type="password" name="new_password1" id="id_new_password1" class="form-input" required>
                <p class="help-text">Must be at least 8 characters</p>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_new_password2">Confirm New Password</label>
                <input type="password" name="new_password2" id="id_new_password2" class="form-input" required>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-primary">Update Password</button>
                <a href="{% url 'journal:profile' %}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
