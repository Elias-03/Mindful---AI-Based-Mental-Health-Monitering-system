<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Mindful</title>
    <link rel="icon" type="image/svg+xml" href="/static/fav.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .logout-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .logout-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            display: block;
        }
        
        .logout-title {
            font-size: 28px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 12px;
        }
        
        .logout-message {
            font-size: 15px;
            color: #86868b;
            margin-bottom: 32px;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
        }
        
        .btn-logout {
            flex: 1;
            padding: 14px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 980px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-logout:hover {
            background: #0077ed;
            transform: scale(1.02);
        }
        
        .btn-cancel {
            flex: 1;
            padding: 14px;
            background: #f5f5f7;
            color: #1d1d1f;
            border: none;
            border-radius: 980px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-cancel:hover {
            background: #e8e8ed;
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <img src="/static/fav.ico" alt="Mindful" class="logout-icon">
        <h2 class="logout-title">See you soon!</h2>
        <p class="logout-message">Are you sure you want to logout?</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="button-group">
                <button type="submit" class="btn-logout">Logout</button>
                <a href="{% url 'journal:dashboard' %}" class="btn-cancel">Stay</a>
            </div>
        </form>
    </div>
</body>
</html>
